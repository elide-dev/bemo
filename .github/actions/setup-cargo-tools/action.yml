name: Setup Cargo tools
description: Install pinned measurement tools from tools/versions.json
inputs:
  tools:
    description: Comma-separated tool keys (nextest, llvm_cov, codspeed)
    default: nextest
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        BEMO_CARGO_TOOLS: ${{ inputs.tools }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        versions = json.load(open('tools/versions.json'))
        names = {'nextest': 'cargo-nextest', 'llvm_cov': 'cargo-llvm-cov', 'codspeed': 'cargo-codspeed'}
        print('tools=' + ','.join(names[key] + '@' + versions[key] for key in os.environ['BEMO_CARGO_TOOLS'].split(',')))
        PY
    - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
      with:
        tool: ${{ steps.versions.outputs.tools }}
