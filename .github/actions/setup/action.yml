name: Setup Bemo
description: Pinned Elide, JVM, and Rust toolchains
inputs:
  java:
    description: JVM version
    default: "25"
  distribution:
    description: JDK distribution
    default: temurin
runs:
  using: composite
  steps:
    - name: Read version pins
      id: versions
      shell: bash
      run: |
        python3 -c 'import json; v=json.load(open("tools/versions.json")); print("elide=" + v["elide"])' >> "$GITHUB_OUTPUT"
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java }}
    - uses: elide-dev/setup-elide@10fbf30cebffd3538c428369950dc2094137f02b # v4.2.0
      with:
        version: ${{ steps.versions.outputs.elide }}
    - name: Bootstrap Rust from the repository toolchain pin
      shell: bash
      run: |
        set -euo pipefail
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        echo "$cargo_bin" >> "$GITHUB_PATH"
        export PATH="$cargo_bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y --no-modify-path --default-toolchain none
        fi
        rustup toolchain install
        rustup show
    - name: Check Rust and Python toolchains
      shell: bash
      run: |
        cargo --version
        rustc --version
        python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
