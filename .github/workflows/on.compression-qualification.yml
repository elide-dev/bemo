name: Gzip level qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bench
      - name: Measure reusable zlib-rs at levels 1, 3, and 6
        run: python3 tools/compression_probe.py --backends zlib-rs --levels 1 3 6 --iterations 2000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compression-level-evidence
          path: build/reports/compression/
          if-no-files-found: error
          retention-days: 30
