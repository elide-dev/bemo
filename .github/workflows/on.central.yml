name: Publish Maven Central
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable GitHub release version (without v)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Immutable GitHub release version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: maven-central-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  central:
    uses: ./.github/workflows/job.central.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read
