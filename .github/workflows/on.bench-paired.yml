name: Paired README benchmarks
on:
  workflow_dispatch:
    inputs:
      before:
        description: Pre-optimization commit or ref
        required: true
        default: 'a4d3cc5bf0ce505335c8d7270e698a27e64318fc'
      after:
        description: Post-optimization commit or ref
        required: true
        default: 'main'
permissions:
  contents: read
concurrency:
  group: readme-benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    uses: ./.github/workflows/check.rust.yml
  jvm:
    uses: ./.github/workflows/check.jvm.yml
  native-image:
    uses: ./.github/workflows/check.native-image.yml
  safety:
    uses: ./.github/workflows/check.safety.yml
  leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bench
      - name: Measure pre-stack and current ownership costs on one host
        env:
          BEMO_LEASE_AFTER: ${{ inputs.after }}
        run: python3 tools/bench_leases.py --before 499a6f3dc4037fa8b7e264fe4928e7c3305b665a --after "$BEMO_LEASE_AFTER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lease-evidence
          path: build/reports/lease-paired/
          if-no-files-found: error
          retention-days: 30
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bench
      - name: Qualify standalone gzip backends on the same host
        run: python3 tools/compression_probe.py --backends zlib-rs --levels 1 3 6 --iterations 2000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compression-evidence
          path: build/reports/compression/
          if-no-files-found: error
          retention-days: 30
      - name: Build both commits before measuring, then alternate samples
        env:
          BEMO_BENCH_BEFORE: ${{ inputs.before }}
          BEMO_BENCH_AFTER: ${{ inputs.after }}
        run: |
          sudo -n prlimit --pid $$ --memlock=unlimited:unlimited
          python3 tools/bench_pair.py --before "$BEMO_BENCH_BEFORE" --after "$BEMO_BENCH_AFTER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paired-transport-evidence
          path: build/reports/readme-paired/
          if-no-files-found: error
          retention-days: 30
