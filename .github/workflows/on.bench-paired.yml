name: Paired README benchmarks
on:
  workflow_dispatch:
    inputs:
      before:
        description: Pre-optimization commit or ref
        required: true
        default: '499a6f3dc4037fa8b7e264fe4928e7c3305b665a'
      after:
        description: Post-optimization commit or ref
        required: true
        default: 'a0537b44c9d17ac312e18adb08500cd1069913ed'
permissions:
  contents: read
concurrency:
  group: readme-benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bench
      - name: Build both commits before measuring, then alternate samples
        env:
          BEMO_BENCH_BEFORE: ${{ inputs.before }}
          BEMO_BENCH_AFTER: ${{ inputs.after }}
        run: |
          sudo -n prlimit --pid $$ --memlock=unlimited:unlimited
          python3 tools/bench_pair.py --before "$BEMO_BENCH_BEFORE" --after "$BEMO_BENCH_AFTER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: paired-transport-evidence
          path: build/reports/readme-paired/
          if-no-files-found: error
          retention-days: 30
