name: Publish GitHub Packages
on:
  workflow_call:
jobs:
  packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select snapshots and the tested release revision
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_packages.py select
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.selection.outputs.publish == 'true'
        with:
          pattern: release-*
          path: build/release-input
          merge-multiple: true
      - name: Verify artifacts from this tested main revision
        if: steps.selection.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py stage
      - name: Publish existing JARs, sources, Javadocs, and native classifiers
        if: steps.selection.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_packages.py publish
