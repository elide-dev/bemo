name: Ingest final private symbols
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful same-repository producer run; blank uses this run
        type: string
        required: false
  workflow_call:
    inputs:
      source_run:
        type: string
        required: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [all]
    env:
      SYMBOL_INGEST_PLATFORM: ${{ matrix.platform }}
      DEBUGINFO_DEV_ORG_ID: ${{ vars.DEBUGINFO_DEV_ORG_ID }}
      DEBUGINFO_DEV_PROJECT_ID: ${{ vars.DEBUGINFO_DEV_PROJECT_ID }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Explain private ingestion policy
        env:
          TRUSTED_BRANCH: ${{ vars.DEBUGINFO_DEV_BRANCH || 'main' }}
        run: |
          echo "Private symbols require configured repository destinations and the linked trusted branch: $TRUSTED_BRANCH."
          echo "PR builds and unconfigured repositories retain their existing private build artifacts without service upload."
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', vars.DEBUGINFO_DEV_BRANCH || 'main') && vars.DEBUGINFO_DEV_PROJECT_ID != ''
        with:
          persist-credentials: false
      - name: Download and validate tested final debug artifacts
        id: plan
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', vars.DEBUGINFO_DEV_BRANCH || 'main') && vars.DEBUGINFO_DEV_PROJECT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
        run: |
          python3 tools/symbol-coverage/ingest-ci.py --config .github/symbol-ingestion.json \
            --source-run "$SOURCE_RUN" --directory "$RUNNER_TEMP/ingest-input" --out "$RUNNER_TEMP/ingest-plan.json"
      - name: Ingest and read back final-symbol batch 1
        if: steps.plan.outputs.has_uploads == 'true' && fromJSON(steps.plan.outputs.batch_count) > 0
        uses: ./.github/actions/ingest-symbol-batch
        with:
          batch: '0'
          url: ${{ vars.DEBUGINFO_DEV_URL }}
          org: ${{ vars.DEBUGINFO_DEV_ORG }}
          project: ${{ vars.DEBUGINFO_DEV_PROJECT }}
      - name: Ingest and read back final-symbol batch 2
        if: steps.plan.outputs.has_uploads == 'true' && fromJSON(steps.plan.outputs.batch_count) > 1
        uses: ./.github/actions/ingest-symbol-batch
        with:
          batch: '1'
          url: ${{ vars.DEBUGINFO_DEV_URL }}
          org: ${{ vars.DEBUGINFO_DEV_ORG }}
          project: ${{ vars.DEBUGINFO_DEV_PROJECT }}
      - name: Ingest and read back final-symbol batch 3
