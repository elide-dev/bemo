name: Release
on:
  workflow_call:
jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Immutability is a repository policy managed by administrators. Its
      # settings endpoint requires Administration:read, unavailable to GITHUB_TOKEN.
      # publish verifies the release's immutable field using Contents permission.
      - name: Create draft after verification
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select draft for this tested revision
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py select
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.draft.outputs.tag != ''
        with:
          pattern: release-*
          path: build/release-input
          merge-multiple: true
      - name: Verify and stage tested artifacts
        if: steps.draft.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py stage
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.draft.outputs.tag != ''
        with:
          cosign-release: v3.0.5
      - name: Sign and verify release assets
        if: steps.draft.outputs.tag != ''
        run: |
          set -euo pipefail
          cd build/release-assets
          for asset in *.zip provenance-*.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/job.release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - name: Upload everything and publish last
        if: steps.draft.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: python3 tools/release.py publish
