name: Push
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/on.verify.yml
    secrets:
      CODECOV_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.CODECOV_TOKEN || '' }}
