name: Check JVM
on:
  workflow_call:
permissions:
  contents: read
jobs:
  jvm:
    name: JVM (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        java: ['22', '25']
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: '2026.9.10'
      # Keep the stock JVM test matrix authoritative after Mise's development JDK.
      - uses: ./.github/actions/setup
        with:
          java: ${{ matrix.java }}
      - name: Check
        run: make check
      - name: Test Netty FFM and C ABI
        run: make test-jvm
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-jvm-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/tests/
          if-no-files-found: warn
