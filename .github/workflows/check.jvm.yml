name: Check JVM
on:
  workflow_call:
permissions:
  contents: read
jobs:
  jvm:
    name: JVM (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        java: ['22', '25']
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.9.10'
      # Keep the stock JVM test matrix authoritative after Mise's development JDK.
      - uses: ./.github/actions/setup
        with:
          java: ${{ matrix.java }}
      - name: Check
        run: make check
      - name: Test Netty FFM and C ABI
        run: make test-jvm
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-jvm-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/tests/
          if-no-files-found: warn
