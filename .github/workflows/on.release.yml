name: Stage Release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/on.verify.yml
    secrets:
      CODECOV_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.CODECOV_TOKEN || '' }}
# Verification uploads unsigned Maven bundles. Publishing is a separate maintainer
# step documented in docs/publishing.md; no secrets are exposed to PR builds.
