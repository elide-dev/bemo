name: Stage Release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/on.verify.yml
# Verification uploads unsigned Maven bundles. Publishing is a separate maintainer
# step documented in docs/publishing.md; no secrets are exposed to PR builds.
