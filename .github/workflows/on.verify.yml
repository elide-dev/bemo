name: Verify
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
jobs:
  rust:
    uses: ./.github/workflows/check.rust.yml
  jvm:
    uses: ./.github/workflows/check.jvm.yml
  native-image:
    uses: ./.github/workflows/check.native-image.yml
  build:
    uses: ./.github/workflows/job.build.yml
  coverage:
    uses: ./.github/workflows/check.coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  benchmarks:
    uses: ./.github/workflows/check.bench.yml
  safety:
    uses: ./.github/workflows/check.safety.yml
  ready:
    name: Ready
    if: always()
    needs: [rust, jvm, native-image, build, coverage, benchmarks, safety]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
