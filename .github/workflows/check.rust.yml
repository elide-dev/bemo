name: Check Rust
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply AWS-LC assembly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV'
      - name: Check generated C exports
        if: runner.os == 'Linux'
        run: python3 tools/generate_exports.py --check
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: runner.os == 'Linux'
        with:
          version: '2026.9.10'
          install_args: aqua:EmbarkStudios/cargo-deny hk pkl
          env: false
          export_path: false
          add_shims_to_path: false
      - name: Audit dependencies across every supported target
        if: runner.os == 'Linux'
        run: '"$(mise which cargo-deny)" --locked --workspace check'
      - name: Install Nextest
        uses: ./.github/actions/setup-cargo-tools
        with:
          tools: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --lib --tests --locked --profile ci
      - run: cargo test --workspace --doc --locked
      - name: Test Linux polling backend explicitly
        if: runner.os == 'Linux'
        env:
          ELIDE_TRANSPORT_TEST_BACKEND: epoll
        run: cargo nextest run -p bemo --lib --tests --locked --profile epoll
      - name: Check external allocator embedding
        run: cargo check --workspace --no-default-features --locked
      - run: cargo build --workspace --release --locked
      - name: Test external Git dependency
        if: runner.os == 'Linux'
        run: python3 tools/test_git_dependency.py
      - name: Upload Rust test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-rust-${{ matrix.os }}
          path: build/reports/tests/
          if-no-files-found: warn
