name: Check Rust
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply AWS-LC assembly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV'
      - name: Check generated C exports
        if: runner.os == 'Linux'
        run: python3 tools/generate_exports.py --check
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        if: runner.os == 'Linux'
        with:
          version: '2026.9.10'
          install_args: aqua:EmbarkStudios/cargo-deny hk pkl
          env: false
          export_path: false
          add_shims_to_path: false
      - name: Audit dependencies across every supported target
        if: runner.os == 'Linux'
        run: '"$(mise which cargo-deny)" --locked --workspace check'
      - name: Install Nextest
        uses: ./.github/actions/setup-cargo-tools
        with:
          tools: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --lib --tests --locked --profile ci
      - run: cargo test --workspace --doc --locked
      - name: Test Linux polling backend explicitly
        if: runner.os == 'Linux'
        env:
          ELIDE_TRANSPORT_TEST_BACKEND: epoll
        run: cargo nextest run -p bemo --lib --tests --locked --profile epoll
      - name: Check external allocator embedding
        run: cargo check --workspace --no-default-features --locked
      - run: cargo build --workspace --release --locked
      - name: Test external Git dependency
        if: runner.os == 'Linux'
        run: python3 tools/test_git_dependency.py
      - name: Upload Rust test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-rust-${{ matrix.os }}
          path: build/reports/tests/
          if-no-files-found: warn
  elide-toolchain:
    # Elide links Bemo into its own static library and ships static musl executables.
    name: Elide toolchain (static musl, embedder)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nextest
        uses: ./.github/actions/setup-cargo-tools
        with:
          tools: nextest
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Run the Rust suite as static musl executables
        run: make test-musl
      - name: Link Bemo into an Elide-shaped static library
        run: make test-embedder
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-elide-toolchain
          path: build/reports/tests/
          if-no-files-found: warn
