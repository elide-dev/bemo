name: Check Rust
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply AWS-LC assembly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV'
      - name: Check generated C exports
        if: runner.os == 'Linux'
        run: python3 tools/generate_exports.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Test Linux polling backend explicitly
        if: runner.os == 'Linux'
        env:
          ELIDE_TRANSPORT_TEST_BACKEND: epoll
        run: cargo test -p dokar --lib --tests --locked
      - name: Check external allocator embedding
        run: cargo check --workspace --no-default-features --locked
      - run: cargo build --workspace --release --locked
      - name: Test external Git dependency
        if: runner.os == 'Linux'
        run: python3 tools/test_git_dependency.py
