name: Build
on:
  workflow_call:
jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read native toolchain version
        id: native-version
        run: python3 -c 'import json; print("version=" + json.load(open("tools/versions.json"))["llvm"]["toolchain_version"])' >> "$GITHUB_OUTPUT"
      - name: Install Elide native toolchain
        id: native-toolchain
        uses: elide-dev/toolchain/action@4c1d0de75d10912ba860a694256dc93830097833
        with:
          version: ${{ steps.native-version.outputs.version }}
          target: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || 'arm64-apple-darwin' }}
      - name: Select LLVM tools
        run: echo "LLVM_BIN=${{ steps.native-toolchain.outputs.home }}/bin" >> "$GITHUB_ENV"
      - name: Stage Maven artifacts
        run: make package
      - name: Validate staged artifacts
        run: python3 tools/verify_package.py
      - name: Attest tested platform bundle
        id: provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/bemo-*-unsigned.zip
      - name: Stage provenance bundle
        if: steps.provenance.outcome == 'success'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "build/provenance-${{ matrix.os }}.json"
      - name: Upload release evidence
        if: steps.provenance.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            build/bemo-*-unsigned.zip
            build/provenance-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-${{ matrix.os }}
          path: build/maven/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-compatibility-${{ matrix.os }}
          path: build/reports/native-compatibility.json
          if-no-files-found: error
