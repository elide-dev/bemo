[workspace]
members = ["crates/dokar", "crates/dokar-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/elide-dev/dokar"

[workspace.dependencies]
dokar = { path = "crates/dokar", version = "0.1.0", default-features = false }

compio-buf = { version = "=0.8.3", git = "https://github.com/elide-tools/compio.git", rev = "61a04b75f7c6299a41c5b3cacb17b5c2d96f824f" }
compio-driver = { version = "=0.12.5", features = ["polling"], git = "https://github.com/elide-tools/compio.git", rev = "61a04b75f7c6299a41c5b3cacb17b5c2d96f824f" }
nohash-hasher = { version = "0.2.0" }
ntex-httparse = { version = "=2.2.0", git = "https://github.com/elide-tools/ntex-httparse", rev = "104a6749f9b8c973e99e9f84cfd2adcfdef96bbf" }
h2 = { version = "0.4.19" }
http = { version = "1" }
bytes = { version = "1" }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "macros", "rt", "sync", "time"] }
socket2 = { version = "0.6", features = ["all"] }
libc = { version = "0" }
rustls = { version = "=0.23.45", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false }
libmimalloc-sys = { version = "=0.1.49" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
not_unsafe_ptr_arg_deref = "deny"
mem_forget = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
uninit_vec = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
manual_c_str_literals = "deny"
implicit_clone = "deny"
redundant_clone = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "debuginfo"
