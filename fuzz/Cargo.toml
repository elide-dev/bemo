[package]
name = "bemo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
bemo = { path = "../crates/bemo", default-features = false, features = ["rust-allocator", "fuzzing"] }
libfuzzer-sys = "=0.4.13"
# Reference implementations used as differential oracles, never as code under test.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
httparse = "=1.10.1"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "buffers"
path = "fuzz_targets/buffers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi"
path = "fuzz_targets/abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gzip"
path = "fuzz_targets/gzip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2"
path = "fuzz_targets/h2.rs"
test = false
doc = false
bench = false
