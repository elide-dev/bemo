micronaut.application.name=bemo-example
micronaut.server.host=127.0.0.1
micronaut.server.port=8080
micronaut.netty.event-loops.default.num-threads=2
micronaut.server.netty.parent.threads=1
micronaut.server.thread-selection=MANUAL
micronaut.server.dual-protocol=${bemo.tls.enabled:true}
micronaut.server.ssl.enabled=${bemo.tls.enabled:true}
micronaut.server.ssl.port=${bemo.tls.port:8443}
micronaut.server.ssl.build-self-signed=false
# Compression is performed per request by the shared native/JDK benchmark helper.
micronaut.server.netty.compression-threshold=-1
