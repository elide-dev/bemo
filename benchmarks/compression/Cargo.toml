[package]
name = "bemo-compression-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
zlib = ["flate2/zlib"]
zlib-rs = ["flate2/zlib-rs", "flate2/runtime_detection"]
zlib-ng = ["flate2/zlib-ng"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false }
crc32fast = "=1.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
