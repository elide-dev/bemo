min_version = "2026.8.3"

[tools]
"github:elide-dev/elide" = "1.5.4+20260921"
java = "openjdk-25.0.2"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
hk = "1.55.0"
pkl = "0.32.1"
"github:nextest-rs/nextest" = { version = "0.9.135", version_prefix = "cargo-nextest-" }
"github:taiki-e/cargo-llvm-cov" = "v0.8.7"

# Rust and its Clippy/rustfmt components are pinned by rust-toolchain.toml.
[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[settings]
lockfile = true

[tasks.build]
run = "make build"
[tasks.check]
run = "make check"
[tasks.test]
run = "make test"
[tasks.fmt]
run = "make fmt"
